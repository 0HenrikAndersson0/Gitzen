name: Build and Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    # This 'if' ensures the job only runs on tags, even if 'on' is misconfigured
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # We use a matrix to run Windows and Linux in parallel
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Automatically caches node_modules based on package-lock.json

      - name: Install Dependencies
        run: npm ci # Use 'npm ci' for faster, cleaner installs in CI environments

      - name: Build & Publish to Public Repo
        run: npx electron-builder --publish always
        env:
          # Your PAT with access to the public release repo
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}