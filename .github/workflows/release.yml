name: Build and Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    # This 'if' ensures the job only runs on tags, even if 'on' is misconfigured
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # Allows the action to create releases and upload assets
    strategy:
      matrix:
        # We use a matrix to run Windows, Linux, and macOS in parallel
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Automatically caches node_modules based on package-lock.json

      - name: Install Dependencies
        run: npm ci # Use 'npm ci' for faster, cleaner installs in CI environments

      - name: Compile Main Process
        run: npm run compile

      - name: Build Renderer
        run: npm run build:renderer

      - name: Build & Publish to Public Repo
        run: npx electron-builder --publish always
        env:
          # Your PAT with access to the public release repo
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

      - name: Upload Artifacts for Scanning
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
          retention-days: 1

  virustotal:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: VirusTotal Scan
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          RELEASE_REPO: 0HenrikAndersson0/gitzen-release
        run: |
          node scripts/virustotal-scan.mjs dist/*.exe dist/*.AppImage dist/*.deb dist/*.dmg dist/*.zip

      - name: Cleanup Artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get artifact IDs for this run and delete them
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[].id' | xargs -I {} gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{}
